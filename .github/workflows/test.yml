name: ARC Runner POC
 
on:

  workflow_dispatch:

  push:

    branches:

      - main
 
permissions:

  contents: read
 
jobs:

  runner-test:

    name: Checkout and Image Build Test

    runs-on: arc-runner-set

    timeout-minutes: 30
 
    steps:

      - name: Checkout repository

        uses: actions/checkout@v4
 
      - name: Verify repository files

        run: |

          set -eu
 
          echo "=== Repository files ==="

          pwd

          ls -la
 
          echo "=== Required files ==="

          for file in Dockerfile README.md app/index.html; do

            if [ -f "$file" ]; then

              echo "PASS: $file exists"

            else

              echo "FAIL: $file missing"

              exit 1

            fi

          done
 
          echo "=== Git Commit ==="

          git rev-parse HEAD
 
      - name: Runner Information

        run: |

          echo "=== Runner Identity ==="

          id
 
          echo "=== Runner Details ==="

          echo "Runner: $RUNNER_NAME"

          echo "OS: $RUNNER_OS"

          echo "Architecture: $RUNNER_ARCH"
 
          echo "=== Kernel ==="

          uname -r
 
      - name: Verify Docker Availability

        run: |

          echo "=== Docker CLI ==="

          docker --version
 
          echo "=== Docker Daemon ==="

          if docker info; then

            echo "PASS: Docker daemon accessible"

          else

            echo "FAIL: Docker daemon unavailable"

            exit 1

          fi
 
      - name: Setup Docker Buildx

        uses: docker/setup-buildx-action@v3
 
      - name: Build Docker Image

        uses: docker/build-push-action@v6

        with:

          context: .

          file: ./Dockerfile

          push: false

          load: true

          tags: arc-runner-poc:test
 
      - name: Verify Built Image

        run: |

          echo "=== Docker Images ==="

          docker images
 
          echo "=== Verify POC Image ==="

          docker image inspect arc-runner-poc:test
 
          echo "PASS: Docker image successfully built"
 
      - name: POC Completion

        run: |

          echo "Git checkout successful"

          echo "Docker image build successful"

          echo "Registry push disabled"

          echo "Kubernetes deployment not configured"
 
