name: ARC CI/CD Demo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  runner-test:
    runs-on: arc-runner-set

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repository files
        run: |
          set -eu
          echo "=== Repository files ==="
          pwd
          ls -la

          echo "=== Required files ==="
          for file in Dockerfile README.md app/index.html; do
            if [ -f "$file" ]; then
              echo "PASS: $file exists"
            else
              echo "FAIL: $file is missing"
              exit 1
            fi
          done

      - name: Display runner information
        run: |
          echo "Runner name: $RUNNER_NAME"
          echo "Runner OS: $RUNNER_OS"
          echo "Runner architecture: $RUNNER_ARCH"

      - name: Inspect runner build capabilities
        run: |
          echo "=== User ==="
          id

          echo "=== Kernel ==="
          uname -r

          echo "=== User namespace settings ==="
          for file in \
            /proc/sys/kernel/unprivileged_userns_clone \
            /proc/sys/user/max_user_namespaces
          do
            if [ -r "$file" ]; then
              printf '%s: ' "$file"
              cat "$file"
            else
              echo "$file: unavailable"
            fi
          done

          echo "=== UID/GID mapping utilities ==="
          for cmd in newuidmap newgidmap; do
            if command -v "$cmd" >/dev/null 2>&1; then
              path="$(command -v "$cmd")"
              echo "$cmd: $path"
              ls -l "$path"
            else
              echo "$cmd: not found in PATH"
            fi
          done

          echo "=== Subordinate UID/GID mappings ==="
          for file in /etc/subuid /etc/subgid; do
            if [ -r "$file" ]; then
              grep "^runner:" "$file" || echo "No runner entry in $file"
            else
              echo "$file: unavailable or unreadable"
            fi
          done

          echo "=== User namespace support ==="
          if command -v unshare >/dev/null 2>&1; then
            if unshare -Ur true; then
              echo "Unprivileged user namespace test: PASS"
            else
              echo "Unprivileged user namespace test: FAIL"
            fi
          else
            echo "unshare: not installed"
          fi

          echo "=== Docker socket ==="
          if [ -S /var/run/docker.sock ]; then
            echo "Docker socket exists"
            ls -l /var/run/docker.sock
          else
            echo "Docker socket is absent"
          fi

          echo "=== BuildKit tools ==="
          for cmd in buildctl buildkitd; do
            if command -v "$cmd" >/dev/null 2>&1; then
              command -v "$cmd"
            else
              echo "$cmd: not installed"
            fi
          done

          echo "=== Filesystem capacity ==="
          df -h "$PWD"

      - name: Rootless BuildKit setup (disabled)
        if: false
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container
          driver-opts: |
            image=moby/buildkit:rootless

      - name: Build container image (disabled)
        if: false
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: arc-runner-poc:latest

      - name: Image build stage
        run: |
          echo "Image build stage completed."
          echo "Actual image building is not enabled."

      - name: Image push stage
        run: |
          echo "DEMO ONLY: Image push is not configured."
          echo "No image was pushed to a registry."

      - name: Deployment stage
        run: |
          echo "DEMO ONLY: Deployment stage reached."
          echo "No Kubernetes resources were changed."
